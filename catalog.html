<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог автохимии и товаров для детейлинга — ПроБлеск Светлогорск</title>
<meta name="description" content="Каталог магазина ПроБлеск: автохимия, очистители, полировка, защита ЛКП, уход за салоном, расходники и готовые наборы. 40+ позиций в наличии.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-catalog>

<header class="header" data-header></header>
<div class="mobile-menu" data-mobile-menu></div>

<main>
<section class="page-head">
  <div class="container">
    <div class="crumbs">
      <a href="index.html">Главная</a> /
      <span>Каталог</span>
    </div>
    <h1>Каталог</h1>
    <p>Автохимия, косметика и расходники для детейлинга. Ассортимент обновляется
      примерно каждые три недели — если чего-то не нашли, напишите, привезём под заказ.</p>
  </div>
</section>

<section class="catalog">
  <div class="container">
    <div class="catalog__layout">

      <!-- боковые фильтры -->
      <aside class="filters" data-filters></aside>

      <!-- товары -->
      <div>
        <div class="catalog__bar">
          <button class="btn btn-ghost btn-sm filters__mobile" data-filters-open>
            <span data-icon="sliders" data-size="16"></span>Фильтры
          </button>
          <div class="catalog__count" data-count></div>
          <div class="catalog__tools">
            <select class="select" data-sort aria-label="Сортировка">
              <option value="popular">Сначала популярные</option>
              <option value="stock">Сначала в наличии</option>
              <option value="price-asc">Сначала дешевле</option>
              <option value="price-desc">Сначала дороже</option>
              <option value="name">По названию</option>
            </select>
            <button class="btn btn-ghost btn-sm filters__mobile" data-filters-close>
              <span data-icon="close" data-size="16"></span>Скрыть
            </button>
          </div>
        </div>

        <div class="active-chips" data-chips></div>

        <h2 class="sr-only">Список товаров</h2>
        <div class="grid grid--3" data-products></div>
      </div>

    </div>
  </div>
</section>
</main>

<footer class="footer" data-footer></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/catalog.js"></script>
</body>
</html>
